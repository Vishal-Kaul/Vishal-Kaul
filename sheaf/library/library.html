<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
<header id="topbar">
  <div class="left">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect x="1.2" y="1.2" width="19.6" height="19.6" rx="5" fill="none" stroke="var(--color-ink)" stroke-width="1.5"/>
        <path d="M6.2 1.95H11V11H1.95V6.2a4.25 4.25 0 0 1 4.25-4.25Z" fill="var(--color-accent)"/>
        <path d="M11 1.2V20.8M1.2 11H20.8" stroke="var(--color-ink)" stroke-width="1.5"/>
        <rect x="1.2" y="1.2" width="19.6" height="19.6" rx="5" fill="none" stroke="var(--color-ink)" stroke-width="1.5"/>
      </svg>
      <span id="product-name"></span>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.2 9.2L12.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="text" autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd>/</kbd>
    </label>
  </div>
  <div class="right">
    <span class="hint">Press Alt+Shift+S on any tab to save it</span>
    <a href="#" id="import" class="toplink">Import</a>
    <a href="#" id="export" class="toplink">Export</a>
  </div>
</header>
<main>
  <div id="tabrow">
    <div id="tabs" role="tablist"></div>
    <div id="tabright">
      <span id="notice" hidden></span>
      <span id="ai-prompt" hidden></span>
      <span id="range"></span>
      <span class="pager"><button id="prev" type="button" aria-label="Previous page">‹</button><button id="next" type="button" aria-label="Next page">›</button></span>
    </div>
  </div>
  <div id="table" role="table">
    <div id="thead" class="row head" role="row"></div>
    <div id="tbody"></div>
  </div>
</main>
<script type="module" src="library.js"></script>
</body>
</html>
